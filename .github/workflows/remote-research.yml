name: PERBOT-222 remote research

on:
  push:
    paths:
      - "tools/extreme_firstpass_oos_v2.py"
      - ".github/workflows/remote-research.yml"
  workflow_dispatch:

jobs:
  firstpass:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          npm install -g dukascopy-node
      - name: Download research data
        run: |
          mkdir -p data/multi
          for d in 2026-09-07 2026-09-08 2026-09-09 2026-09-10 2026-09-11 2026-09-13 2026-09-14 2026-09-15 2026-09-16 2026-09-20 2026-09-21 2026-09-22 2026-09-23 2026-09-24 2026-09-25; do
            npx dukascopy-node -i xauusd -from "$d" -to "$(date -u -d "$d + 1 day" +%Y-%m-%d)" -t tick -f csv -dir data/multi || true
          done
      - name: Run first-passage OOS
        run: |
          python tools/extreme_firstpass_oos_v2.py | tee results_firstpass_v2.txt
      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: perbot222-firstpass-v2
          path: results_firstpass_v2.txt
