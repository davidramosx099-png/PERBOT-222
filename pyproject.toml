[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perbot222"
version = "0.1.0"
description = "Tick-based short-horizon research engine for PERBOT-222"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
